services:
  onto-postgres:
    image: postgres:16-alpine
    container_name: onto-romaapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onto
      POSTGRES_PASSWORD: onto
      POSTGRES_DB: onto_romaapi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - onto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onto -d onto_romaapi"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  onto_postgres_data:
